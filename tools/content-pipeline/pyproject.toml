[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "english-learning-content-pipeline"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "pdfplumber>=0.11,<1",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
content-pipeline = "content_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
